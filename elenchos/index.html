 intro:["Ah… finalmente sei qui.","Mancano cinque giorni al mio processo. I miei avversari hanno sottratto i tre scritti di Platone… e senza di essi, la mia sorte è incerta.","Ma non aspettarti che sia io a darti le risposte. Ti farò soltanto domande. Sarai tu a cercare la verità, passo dopo passo.","E se alla fine troverai una ragione abbastanza forte… forse troverai anche il modo di convincermi a lasciare questa cella."],

 talk:{guard:"Muoviti. Il prigioniero ha cinque giorni, poi la nave da Delo riporterà il verdetto.",soc:"Va' da Platone, alla locanda. È malato, ma ha qualcosa per te.",
  pizia:"Viandante, non si vince con la forza: si vince ascoltando. Cerca la contraddizione tra le due frasi di chi hai davanti, poi chiediti cosa ti chiederebbe Socrate. Per un obolo ti toglierò un dubbio.",
  fin:"Hai riunito i frammenti… Ora dimmi: perché dovrei lasciare Atene?"},

  delfi:[[0,0,"Delfi. All'ombra del tempio di Apollo, la Pizia danza tra i fumi dell'alloro.","gong"],[5000,0,"I rami sacri bruciano. La voce del dio sta per parlare.","fire"]],

  pit:{n:"Pitagora",id:"pit",bg:0,reward:10,card:"Pitagora, a Crotone, ti guarda dall'alto: «Quello che dice il Maestro è vero, e basta.»",
   tablet:["«La parola del Maestro è verità assoluta.»","«Il Maestro è famoso per aver dimostrato il Teorema.»"],frag:"L'autorità non basta: contano le ragioni.",
   steps:[{say:"Il Maestro non sbaglia mai. Se lo dice lui, per me basta.",q:"Cosa ha reso famoso il Maestro?",why:"Rileggi la tavoletta: per cosa è famoso il Maestro?",ans:[["Ha fondato una grande città sul mare.",0],["Ha scritto molte poesie sugli dei.",0],["Ha dimostrato un teorema geometrico.",1]]},
    {say:"Un teorema, certo… ma io mi fido del Maestro, non dei calcoli.",q:"Cos'è esattamente un teorema?",why:"Un teorema non si crede: si controlla.",ans:[["Una dimostrazione che chiunque può controllare.",1],["Una regola magica che i discepoli ricevono dal Maestro stesso.",0],["Un ordine che il più forte dà a tutti gli altri discepoli.",0]]},
    {say:"Allora cosa conta di più: chi parla, o ciò che dice?",q:"Quindi il Maestro ha usato l'autorità o la logica?",why:"Una dimostrazione vale anche se a dirla è uno sconosciuto.",ans:[["Ha minacciato chi dubitava, finché tutti hanno smesso di chiedere.",0],["Ha chiesto a un oracolo di confermare ogni sua parola in pubblico.",0],["Ha usato un ragionamento verificabile: vale per sé, non per l'autorità.",1]]}]},
  era:{n:"Eraclito",id:"era",bg:1,reward:15,card:"Eraclito, a Efeso, sorride accanto al fiume: «Tutto scorre. Niente resta mai uguale.»",

   steps:[{say:"Le parole sono come l'acqua: cambiano mentre le dici.",q:"Se tutto cambia, cosa succede alla tua filosofia?",why:"Una frase deve restare uguale mentre la dici.",ans:[["Che tutti la capiscono subito, perché cambia insieme a chi ascolta.",0],["Se le parole cambiano mentre parli, «tutto scorre» non dice nulla.",1],["Che diventa sempre più ricca e famosa, di città in città.",0]]},
    {say:"Allora «cambiamento» cambia anch'essa, non è vero?",q:"La parola «cambiamento» ha un significato fisso o cambia anch'essa?",why:"Se la parola cambiasse sempre, non potremmo capirci.",ans:[["Cambia di significato ogni secondo, proprio come scorre un fiume.",0],["È una parola inventata dagli dei, e nessuno può spiegarla.",0],["Deve restare fissa, altrimenti non potremmo nemmeno usare la parola.",1]]},
    {say:"Eppure il mondo è un fiume che nessuno può fermare.",q:"Per dire che tutto cambia, hai dovuto usare qualcosa che NON cambia?",why:"Rispondi alla domanda: serve qualcosa di fermo?",ans:[["No: il fiume è fatto di fuoco, e il fuoco non si ferma mai.",0],["Meglio stare in silenzio, perché ogni parola finirebbe per cambiare.",0],["Sì: sotto il continuo mutare del mondo c'è una verità stabile.",1]]}]},
  pro:{n:"Protagora",id:"pro",bg:2,reward:20,card:"Protagora, nell'Agorà di Atene, allarga le braccia: «Ognuno ha la sua verità. Provami il contrario!»",
   tablet:["«L'uomo è misura di tutte le cose: la verità è relativa.»","«Non esistono opinioni false.»"],frag:"Non tutte le opinioni valgono: alcune cose sono vere per tutti.",
   steps:[{say:"Ogni opinione è vera per chi la pensa. Nessuno può darmi torto.",q:"Se ogni opinione è vera, cosa succede se qualcuno dice che Protagora ha torto?",why:"Applica la regola di Protagora a chi lo contraddice.",ans:[["Nessuno osa dirlo, perché Protagora è troppo famoso in tutta Atene.",0],["Per la tua regola, anche chi dice «Protagora mente» ha ragione!",1],["Gli chiede dell'oro, perché le opinioni migliori si pagano di più.",0]]},
    {say:"Be', diciamo che alcune opinioni… valgono di più.",q:"Ma non avevi detto che NON esistono opinioni sbagliate?",why:"Non dare ragione a lui: cerca la contraddizione.",ans:[["Protagora ha sempre ragione, perché è lui che misura le cose.",0],["Ha ragione chi paga di più, perché il denaro convince tutti.",0],["Se ammetti opinioni sbagliate, distruggi la tua teoria.",1]]},
    {say:"Parlare bene convince tutti. Che differenza fa la verità?",q:"Se stai male, ti fidi di chiunque o cerchi un medico?",why:"Pensa a cosa fai davvero quando stai male.",ans:[["Mi fido del più simpatico, perché ognuno ha la sua verità.",0],["Cerchi un medico: la salute è una realtà, non un'opinione.",1],["Tiro a sorte, tanto ogni cura è vera quanto un'altra.",0]]}]},
  soc:{n:"Socrate",id:"soc",bg:3,reward:0,card:"Socrate ti guarda attraverso le sbarre: «Ho ascoltato i tuoi frammenti. Ora convincimi.»",
   tablet:["«L'autorità non basta: contano le ragioni.»","«Una verità stabile resta vera ovunque.»","«Non tutte le opinioni valgono.»"],
   steps:[{say:"I giudici di Atene decideranno. La loro parola è legge, e la legge si rispetta.",q:"La parola dei giudici basta a renderla giusta, o servono ragioni?",why:"Ricorda il frammento di Pitagora: l'autorità da sola non basta.",ans:[["Basta e avanza, perché nessuno ha il diritto di mettere in dubbio i giudici.",0],["Non basta: l'autorità da sola non rende giusta una decisione.",1],["Meglio non pensarci, perché i giudici fanno sempre quello che vogliono.",0]]},
    {say:"Io non ho paura. Dove andrei? Atene è tutto ciò che conosco.",q:"Il tuo pensiero è una verità stabile: può restare vivo anche lontano da qui?",why:"Ricorda il frammento di Eraclito: sotto il cambiamento c'è qualcosa di stabile.",ans:[["No: senza queste mura e questa piazza il tuo pensiero svanirebbe subito.",0],["Non lo so, ma qui almeno tutti conoscono già il tuo nome.",0],["Sì: una verità stabile vale ovunque, anche su una nave diretta lontano.",1]]},
    {say:"E se Atene non volesse più ascoltarmi? Se la mia voce non servisse?",q:"Decide solo l'opinione dei giudici, o conta anche ciò che insegni?",why:"Ricorda il frammento di Protagora: non tutte le opinioni valgono.",ans:[["Sì, se i giudici dicono che sei in torto, allora hai torto davvero.",0],["Conta solo ciò che pensa la maggioranza, perché ognuno ha la sua verità.",0],["Non tutte le opinioni valgono: ciò che insegni resta vero.",1]]},
   {say:"Ho passato la vita a obbedire alle leggi di Atene. Fuggire sarebbe tradirle.",q:"Obbedire a una legge significa non poterla mai mettere in discussione?",why:"Rispettare una legge e discuterla possono convivere: è proprio ciò che fai con le domande.",ans:[["Sì: chi discute una legge la sta già infrangendo, e questo non si fa.",0],["No: si può rispettare la legge e intanto discutere se è giusta.",1],["Dipende da chi governa: se comanda il più forte, allora è giusta.",0]]},
 {say:"Se vado via, dirò che i miei principi valgono solo finché non costano nulla.",q:"Essere coerenti vuol dire accettare la pena, o continuare a cercare ciò che è vero?",why:"La coerenza sta nel cercare il vero, non nel dimostrare quanto si è disposti a soffrire.",ans:[["Accettare la pena: solo chi soffre per le sue idee dimostra di crederci.",0],["Continuare a cercare il vero: la coerenza è nel metodo, non nel sacrificio.",1],["Fare come fanno tutti, perché chi si distingue finisce sempre nei guai.",0]]},
 {say:"E se restare fosse proprio la mia lezione migliore? Un gesto vale più di mille discorsi.",q:"Una lezione si misura da quanto impressiona, o da quanto aiuta gli altri a ragionare?",why:"Una lezione vale per quanto fa pensare gli altri: e puoi continuare a darla anche altrove.",ans:[["Da quanto impressiona: un gesto estremo convince più di molte parole.",0],["Da quanti applausi riceve sul momento, come succede agli oratori.",0],["Da quanto aiuta gli altri a ragionare, e questo si può fare ovunque.",1]]},

T.talkG=["Fermo! Questa non è una locanda. Fuori dalla mia vista.","Un'altra parola e passi la notte in cella, accanto al tuo amico.","Il vecchio ha cinque giorni. E io non ho nessuna pazienza per i suoi ammiratori.","Hai gli occhi troppo curiosi, ragazzo. Sparisci.","Tocca la mia lancia e ti spezzo le dita."];
T.cit={atene:["Hai sentito? Socrate sarà processato tra pochi giorni. Che Atena lo protegga.","Se cerchi Platone, è alla locanda: dicono che sia malato, ma ha qualcosa per te.","Dal varco in fondo all'agorà parte la strada per tutta la Grecia. Il filosofo che cerchi ti aspetta laggiù.","I rivali di Socrate sono sicuri di sé. Tu ascolta e fai domande: è così che si vince."],crotone:["Pitagora ti aspetta al centro della scuola. Non farlo attendere!","Qui si dice che tutto sia numero… ma tu chiedigli cosa rende vera una cosa.","Il Maestro parla sempre di dimostrazioni: eppure ama farsi credere sulla parola."],efeso:["Eraclito è laggiù, accanto al tempio: parla sempre del fiume che scorre.","Dicono che nessuno si bagni mai due volte nello stesso fiume. Chiediglielo!","Il filosofo ti aspetta: avvicinati e ascolta con attenzione."],agora:["Protagora ti aspetta sotto il portico: sa convincere chiunque.","Qui in agorà ognuno ha la sua opinione. Ma sono tutte vere?","Il filosofo ti aspetta: non farti dare ragione troppo in fretta."],final:["Corri da Socrate! Non c'è più tempo.","La porta «PRIGIONE» è in alto a sinistra: il filosofo ti aspetta.","Hai tutti i frammenti? Allora Socrate ti sta aspettando."]};
T.cit.tempio=["Questo luogo è fatto di silenzio. Qui si impara ad ascoltare, prima di parlare.","Il filosofo che cerchi ti aspetta fuori: non farlo attendere."];T.cit.casa=["Siamo gente semplice, ma anche noi ci facciamo domande. Il filosofo che cerchi ti aspetta all'aperto.","Vuoi un po' d'acqua, viandante? Poi va' pure da Pitagora: ti aspetta."];T.cit.torre=["Dall'alto si vede tutta la città. Il filosofo ti aspetta di sotto."];

T.cit.tempio=["Qui si impara ad ascoltare prima di parlare. Anche il silenzio è una risposta.","Gli dèi non rispondono con parole, ma con domande. Come fa Socrate.","Il filosofo che cerchi ti aspetta fuori: non farlo attendere."];
T.cit.casa=["Studiamo i numeri: ogni cosa ha una proporzione. Ma Pitagora ti aspetta fuori, al centro della scuola.","Questi rotoli parlano di triangoli. Il Maestro dice che il teorema vale per tutti… ma lo ha dimostrato, non imposto.","Vuoi un po' d'acqua? Poi va' da Pitagora: ti aspetta."];

T.talkTorre=["Questa è la mia torre. Passa e non toccare niente.","Lance e scudi, tutti affilati. Non farmi venire voglia di usarli.","Straniero, a Crotone i discorsi sono più affilati delle lance. E io, più dei discorsi."];
T.th.bedE=["Un letto vuoto, rifatto con cura. Qui si dorme poco: si pensa molto."];T.th.altar=["Un altare con la fiamma accesa. Si offre qualcosa agli dèi… e a se stessi, un po' di silenzio."];T.th.shelf=["Rotoli con numeri e figure: triangoli, cerchi, proporzioni. Il mondo sembra fatto di rapporti."];T.th.rack=["Lance e scudi di bronzo. Meglio un buon argomento che un colpo ben assestato."];T.th.bench=["Una panca di legno. Chi vi siede ascolta, o aspetta."];
T.th.fount=["Una fontana: l'acqua scorre e il suono aiuta a pensare."];

T.cit.tempioA=["Qui si onora Atena: la saggezza non grida, osserva.","Atena nacque dalla testa di Zeus, dicono. Forse perché le idee migliori nascono pensando.","Chi entra con una domanda ne esce con due: è il dono di questa casa.","Anche la civetta di Atena vede nel buio: i dubbi non vanno temuti.","Socrate è venuto qui spesso a fare domande, e noi a rispondere con altre domande.","Il filosofo che cerchi ti aspetta fuori: non farlo attendere."];
T.cit.tempioD=["Sul nostro tempio è scritto: «Conosci te stesso». Non è un ordine, è un invito.","La Pizia parla per enigmi, ma l'enigma più difficile resta chi sei tu.","Apollo ama la misura: niente di troppo, nemmeno nelle certezze.","L'oracolo disse che nessuno era più sapiente di Socrate. E lui andò in giro a cercare qualcuno più sapiente.","Qui si porta una domanda e si riceve un enigma: poi tocca a te scioglierlo.","Offri l'alloro e ascolta: il fumo racconta a chi sa aspettare."];
T.cit.tempioE=["Artemide protegge viaggiatori e boschi: anche chi cerca la verità è un po' viaggiatore.","Il fiume qui accanto non sta mai fermo, il tempio sì: forse servono entrambe le cose.","Eraclito viene spesso a sedersi qui fuori. Dice che tutto scorre, ma poi si siede sempre sullo stesso gradino.","Sotto i portici di Efeso si fanno più domande che scambi di merci. È sempre stato così.","Se perdi la strada, ascolta il fiume: ti riporta sempre al mare, e a un'altra domanda.","Il filosofo ti aspetta all'aperto: avvicinati con calma."];
