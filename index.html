<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elenchos</title>

<style>
:root{--bg:#f3e9d2;--tx:#1b1b2f;--pn:#fff7e0;--ac:#b5541c;--ok:#2f8f4a;--no:#c0392b;--wax:#c9a46a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b2f;--tx:#f4f0e0;--pn:#2a2a4a;--ac:#f2c14e;--ok:#6fcf7f;--no:#ef6a6a}}
:root[data-theme="dark"]{--bg:#1b1b2f;--tx:#f4f0e0;--pn:#2a2a4a;--ac:#f2c14e;--ok:#6fcf7f;--no:#ef6a6a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:12px/1.8 monospace;min-height:100%}
#app{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:30px;margin:10px 0;color:var(--ac);text-align:center;letter-spacing:2px}
h2{font-size:14px;margin:14px 0 6px;color:var(--ac)}
.c{text-align:center}.sm{font-size:10px}
.box{background:var(--pn);border:4px solid var(--tx);box-shadow:4px 4px 0 var(--tx);padding:12px;margin:12px 0}
.wax{background:var(--wax);color:#2b1d0e;border:4px solid #6b4a1e;padding:12px;margin:12px 0;box-shadow:4px 4px 0 #6b4a1e}
.wax p{margin:8px 0}
button{display:block;width:100%;min-height:54px;margin:10px 0;padding:10px 12px;background:var(--pn);color:var(--tx);border:4px solid var(--tx);box-shadow:4px 4px 0 var(--tx);font:inherit;text-align:left;cursor:pointer}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--tx)}
button.go{background:var(--ac);color:#fff;text-align:center}
:root:not([data-theme="light"]) button.go{color:#1b1b2f}
button.sel{outline:4px solid var(--ac);outline-offset:2px}
.hud{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;padding:8px 0;border-bottom:4px solid var(--tx);margin-bottom:8px;font-size:11px;}
.row{display:flex;gap:8px}.row button{text-align:center;padding:8px 4px;font-size:10px}
.who{display:flex;gap:12px;align-items:flex-start}.who svg{flex:none}
.bar{display:flex;justify-content:flex-end;gap:8px}.bar button{width:auto;min-height:38px;margin:0 0 6px;padding:6px 8px;font-size:9px;text-align:center}
.stop{display:flex;justify-content:space-between;gap:8px;align-items:center}.stop span.st{font-size:9px;flex:none}
.map{width:100%;height:auto;display:block;border:4px solid var(--tx);background:#3a6fa8}.map text{font-family:monospace;paint-order:stroke;stroke:#1b1b2f;stroke-width:2.5px;stroke-linejoin:round}
.ok{color:var(--ok)}.no{color:var(--no)}
@keyframes f{from{opacity:0}to{opacity:1}}.fade{animation:f 3s ease-in}.blk{background:#000;color:#f4f0e0;border-color:#000;box-shadow:none}
svg{image-rendering:pixelated;shape-rendering:crispEdges}

.type{min-height:2em}
.typing-actions{display:flex;justify-content:flex-end;gap:8px;margin:4px 0 8px}
.typing-actions button{width:auto;min-height:34px;margin:0;padding:5px 8px;font-size:8px}
.player-card{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.05);border:2px dashed var(--tx);padding:7px;margin:8px 0}
.player-card .sm{margin:0}
.answer-lock{opacity:.7}
</style></head><body>
<div id="app"></div>
<script>
/* ===== TESTI E DATI (tutto il contenuto del gioco è qui) ===== */
const T={
 title:"ELENCHOS", sub:"Atene, 399 a.C. Qui vince chi ascolta, non chi sa.",
 intro:[
  {who:"socrate",name:"Socrate",text:"Atene, 399 a.C. Mancano 5 giorni al mio processo. I rivali hanno preso i tre scritti di Platone. Io ti farò solo domande: la risposta devi trovarla tu."},
  {who:"platone",name:"Platone, malato",text:"Prendi il mio anello: ti aprirà le porte. Recupera i tre frammenti. Serviranno a difendere Socrate."}
 ],
 avatars:[{n:"Aris",t:"#3a6fd8",h:"#4a2c14"},{n:"Nike",t:"#c0392b",h:"#e0b030"},{n:"Teo",t:"#2f8f4a",h:"#222222"}],
 schools:[
  {n:"Megarica",f:"Fondata da Euclide di Megara, allievo di Socrate. Maestri di discussione.",p:"Potere: vedi meglio i punti deboli di un discorso."},
  {n:"Cinica",f:"Fondata da Antistene, allievo di Socrate. Vita semplice, con poco.",p:"Potere: vivi con poco, quindi gli oboli valgono di più."},
  {n:"Cirenaica",f:"Fondata da Aristippo, allievo di Socrate. Stare bene ovunque.",p:"Potere: sai adattarti, quindi un errore pesa meno."}
 ],
 powerNote:"I poteri delle scuole arriveranno presto: per ora scegli solo la tua.",
map:{title:"LA GRECIA ANTICA",hint:"Scegli una tappa. Ogni luogo ha un tema.",
  stops:[
   {id:"delfi",n:"Delfi",who:"La Pizia",theme:"Conosci te stesso",q:"Chi sei, davvero?",x:132,y:104,l:1},
   {id:"pit",n:"Crotone",who:"Pitagora",theme:"Autorità",q:"Basta che lo dica un maestro?",x:30,y:205},
   {id:"era",n:"Efeso",who:"Eraclito",theme:"Cambiamento",q:"Se tutto cambia, cosa resta?",x:276,y:150,l:1},
   {id:"pro",n:"Atene",who:"Protagora",theme:"Relativismo",q:"Ogni opinione è vera?",x:190,y:128}],
  done:"VINTO",todo:"SFIDA",pizia:"INDIZI",finish:"VAI AL FINALE"},
 ui:{start:"INIZIA",next:"AVANTI",choose:"SCEGLI IL TUO FILOSOFO",school:"SCEGLI LA TUA SCUOLA",go:"COMINCIA",fight:"SFIDA",step:"Passo",
  lose:"Il tempo è scaduto. La nave da Delo entra in porto. Il processo inizia senza difesa e Socrate viene condannato.",
  restart:"RICOMINCIA",fragT:"HAI IL FRAMMENTO!",back:"TORNA ALLA MAPPA",hintBtn:"USA INDIZIO",buy:"COMPRA INDIZIO (1 obolo)",
  pizia:"La Pizia: «Socrate è il più sapiente perché sa di non sapere. Per un obolo ti do un indizio.»",
  piziaNo:"Non hai oboli. Vinci un duello e torna da me.",hints:"Indizi:",hintInfo:"Un indizio toglie una risposta sbagliata.",
  fin:"Hai i tre frammenti. Ora Socrate ti ascolta.",finNote:"Con 30 oboli o più si apre anche l'Esilio.",tribunale:"TRIBUNALE",esilio:"ESILIO",fade:"La scena sfuma..."},
 duels:{
  pit:{n:"Pitagora",sp:"pitagora",reward:10,card:"Pitagora, a Crotone, dice: «Quello che dice il Maestro è vero, e basta.»",
   tablet:["«La parola del Maestro è verità assoluta.»","«Il Maestro è famoso per aver dimostrato il Teorema.»"],
   frag:"L'autorità non basta: contano le ragioni.",
   steps:[
    {q:"Cosa ha reso famoso il Maestro?",why:"Rileggi la tavoletta: per cosa è famoso il Maestro?",ans:[{t:"Ha fondato una città."},{t:"Ha scritto poesie."},{t:"Ha dimostrato un teorema geometrico.",ok:1}]},
    {q:"Cos'è esattamente un teorema?",why:"Un teorema non si crede: si controlla.",ans:[{t:"Una dimostrazione logica passo dopo passo che chiunque può verificare.",ok:1},{t:"Una regola magica."},{t:"Un ordine del più forte."}]},
    {q:"Quindi il Maestro ha usato l'autorità o la logica?",why:"Una dimostrazione vale anche se a dirla è uno sconosciuto.",ans:[{t:"Ha minacciato chi dubitava."},{t:"Ha usato un ragionamento verificabile: la dimostrazione vale per sé, non per l'autorità!",ok:1},{t:"Ha chiesto un oracolo."}]}]},
  era:{n:"Eraclito",sp:"eraclito",reward:15,card:"Eraclito, a Efeso, dice: «Tutto scorre. Niente resta mai uguale.»",
   tablet:["«Tutto scorre, nulla resta fermo.»","«Definire una cosa con un nome fisso è una bugia.»"],
   frag:"Anche per parlare del cambiamento serve qualcosa che resta fermo.",
   steps:[
    {q:"Se tutto cambia, cosa succede alla tua filosofia?",why:"Una frase deve restare uguale mentre la dici.",ans:[{t:"Tutti capiscono subito."},{t:"Se le parole cambiano significato mentre parli, «Tutto scorre» non significa nulla.",ok:1},{t:"Diventi ricco."}]},
    {q:"La parola «cambiamento» ha un significato fisso o cambia anch'essa?",why:"Se la parola cambiasse sempre, non potremmo capirci.",ans:[{t:"Cambia significato ogni secondo."},{t:"È inventata dagli dei."},{t:"Deve avere un significato fisso, altrimenti non potremmo usare la parola.",ok:1}]},
    {q:"Per dire che tutto cambia, hai dovuto usare qualcosa che NON cambia?",why:"Rispondi alla domanda: serve qualcosa di fermo?",ans:[{t:"Il fiume è fatto di fuoco."},{t:"Meglio stare in silenzio."},{t:"Sì: c'è una verità stabile sotto il continuo mutare del mondo!",ok:1}]}]},
  pro:{n:"Protagora",sp:"protagora",reward:20,card:"Protagora, all'Agorà di Atene, dice: «Ognuno ha la sua verità.»",
   tablet:["«L'uomo è misura di tutte le cose: la verità è relativa.»","«Non esistono opinioni false.»"],
   frag:"Non tutte le opinioni valgono: alcune cose sono vere per tutti.",
   steps:[
    {q:"Se ogni opinione è vera, cosa succede se qualcuno dice che Protagora ha torto?",why:"Applica la regola di Protagora a chi lo contraddice.",ans:[{t:"Nessuno osa dirlo."},{t:"Gli chiede dell'oro."},{t:"Se un uomo dice «Protagora mente», secondo la tua regola anche quell'uomo ha ragione!",ok:1}]},
    {q:"Ma non avevi detto che NON esistono opinioni sbagliate?",why:"Non dare ragione a lui: cerca la contraddizione.",ans:[{t:"Protagora ha sempre ragione."},{t:"Se ammetti opinioni sbagliate, distruggi la tua stessa teoria.",ok:1},{t:"Chi paga di più ha ragione."}]},
    {q:"Se stai male, ti fidi di chiunque o cerchi un medico?",why:"Pensa a cosa fai davvero quando stai male.",ans:[{t:"Mi fido del più simpatico."},{t:"Tiro a sorte."},{t:"Cerchi il medico, perché la salute è una realtà oggettiva e non un'opinione!",ok:1}]}]},
  soc:{n:"Socrate",sp:"socrate",reward:0,card:"Socrate, in cella, ti guarda: «Aspetto la tua proposta.»",
   steps:[{q:"Perché dovrei fuggire e violare le leggi?",why:"Socrate rispetta le leggi: serve una ragione più grande.",ans:[{t:"Perché hai paura di morire."},{t:"Perché la tua filosofia appartiene a tutta la Grecia, non solo ad Atene!",ok:1},{t:"Perché le leggi non contano niente."}]}]}},
 end:{
  A:{a:["Tribunale di Atene. Socrate si difende con i tre frammenti di Platone.","I giudici lo condannano a maggioranza. Socrate accetta il verdetto con serenità: «Preferisco subire un'ingiustizia che commetterla.»"],
     b:["Platone raccoglie i frammenti e li custodisce.","Da quelle parole nasceranno i Dialoghi."]},
  B:{a:["Porto del Pireo. Socrate accetta di lasciare Atene.","I tuoi oboli pagano il viaggio. Con Platone e con te, sale su una nave per la Sicilia."],
     b:["Fonderà una scuola itinerante e insegnerà a chiunque voglia ascoltare.","Nella storia vera, Socrate rifiutò di fuggire. Qui Elenchos immagina un altro finale."]}}
};
/* ===== SPRITE ===== */
const BASE=["..HHHH..",".HHHHHH.",".SSSSSS.",".SESSES.",".SSSSSS.","..TTTT..",".TTTTTT.","STTTTTTS",".TTTTTT.",".TT..TT."];
const PEOPLE={socrate:{H:"#bdbdbd",S:"#e8b890",T:"#e8e0c8",E:"#222"},platone:{H:"#6b4a1e",S:"#e8b890",T:"#8a5cc0",E:"#222"},pitagora:{H:"#dddddd",S:"#e8b890",T:"#f0f0f0",E:"#222"}};
function spr(p,px=9){let r="";BASE.forEach((row,y)=>[...row].forEach((c,x)=>{if(c!=".")r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${p[c]}"/>`}));return `<svg width="${8*px}" height="${10*px}" viewBox="0 0 8 10" aria-hidden="true">${r}</svg>`}
const av=i=>{const a=T.avatars[i];return {H:a.h,S:"#e8b890",T:a.t,E:"#222"}};
/* ===== STATO ===== */
const S={scr:"title",i:0,av:0,sc:0,days:5,ob:0,won:[],msg:"",cur:"",step:-1,dead:[],fb:"",hints:0,snd:true,typing:null,typingTimer:null};
let AC;
function beep(f,d=.12){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type="square";o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function tg(){S.snd=!S.snd;beep(440);R()}
const hud=()=>`<div class="hud"><span>GIORNI ${"■".repeat(Math.max(S.days,0))}${"□".repeat(5-Math.max(S.days,0))}</span><span>FRAMMENTI ${S.won.length}/3</span><span>OBOLI ${S.ob}</span></div>`;
const btn=(t,fn,c="go")=>`<button class="${c}" onclick="${fn}">${t}</button>`;
/* ===== SCHERMATE ===== */
const SC={
 title:()=>`<h1>${T.title}</h1><div class="c">${spr(PEOPLE.socrate,14)}</div><p class="c sm">${T.sub}</p>${btn(T.ui.start,"go('intro')")}`,
 intro:()=>{const s=T.intro[S.i];return `<div class="who">${spr(PEOPLE[s.who])}<div><h2>${s.name}</h2></div></div><div class="box"><div class="type" data-type="${esc(s.text)}"></div></div>${typeControl()}${btn(T.ui.next,"nextIntro()")}`},
 pick:()=>`<h2>${T.ui.choose}</h2><div class="row">${T.avatars.map((a,i)=>`<button class="${S.av==i?"sel":""}" onclick="S.av=${i};beep(500);R()">${spr(av(i),6)}<br>${a.n}</button>`).join("")}</div>
  <div class="player-card">${spr(av(S.av),5)}<div><b>IL TUO PERSONAGGIO</b><br><span class="sm">${T.avatars[S.av].n}</span></div></div>
  <h2>${T.ui.school}</h2>${T.schools.map((s,i)=>`<button class="${S.sc==i?"sel":""}" onclick="S.sc=${i};beep(500);R()">${s.n}<br><span class="sm">${s.f}<br>${s.p}</span></button>`).join("")}<p class="sm">${T.powerNote}</p>${btn(T.ui.go,"go('map')")}`,
 map:()=>{const m=T.map,st=m.stops;
  const pin=(s,i)=>{const d=S.won.includes(s.id),c=d?"#6fcf7f":s.id=="delfi"?"#c9a0e0":"#f2c14e",l=s.l?"end":"start",dx=s.l?-9:9;
   return `<g onclick="visit('${s.id}')" style="cursor:pointer"><rect x="${s.x-6}" y="${s.y-6}" width="12" height="12" fill="${c}" stroke="#1b1b2f" stroke-width="2"/><text x="${s.x}" y="${s.y+3}" font-size="7" text-anchor="middle" fill="#1b1b2f" stroke="none">${i+1}</text>
   <text x="${s.x+dx}" y="${s.y-1}" font-size="7" text-anchor="${l}" fill="#f2c14e">${s.theme.toUpperCase()}</text><text x="${s.x+dx}" y="${s.y+8}" font-size="5" text-anchor="${l}" fill="#f4f0e0">${s.n} - ${s.who}</text></g>`};
  const svg=`<svg class="map" viewBox="0 0 320 300" role="img" aria-label="Mappa della Grecia antica"><g fill="#c9b36a" stroke="#6b5a2a" stroke-width="2" stroke-linejoin="miter">
   <polygon points="0,150 35,168 52,210 32,252 12,232 0,200"/><polygon points="70,30 190,30 250,50 235,75 200,90 185,105 190,125 170,140 150,140 145,165 100,160 95,135 105,115 85,100 80,70 65,50"/>
   <polygon points="105,165 140,165 168,178 176,198 160,226 130,236 104,216 98,190"/><polygon points="290,20 320,20 320,250 300,262 284,222 296,180 274,150 286,110 268,70"/>
   <polygon points="110,268 200,262 206,276 120,284"/><polygon points="172,86 196,100 190,107 169,93"/><rect x="205" y="150" width="8" height="8"/><rect x="225" y="175" width="10" height="8"/><rect x="190" y="205" width="8" height="8"/><rect x="235" y="215" width="12" height="8"/></g>
   ${st.map(pin).join("")}</svg>`;
  const row=(s,i)=>{const d=S.won.includes(s.id),t=d?m.done:s.id=="delfi"?m.pizia:m.todo;return `<button class="stop" onclick="visit('${s.id}')"><span>${i+1}. ${s.n.toUpperCase()}<br><span class="sm">${s.theme}: ${s.q}</span></span><span class="st ${d?"ok":""}">${t}</span></button>`};
  return hud()+`<div class="player-card">${spr(av(S.av),5)}<div><b>${T.avatars[S.av].n}</b><br><span class="sm">${T.schools[S.sc].n} · ${T.schools[S.sc].p}</span></div></div><h2>${m.title}</h2><p class="sm">${m.hint}</p>${svg}${S.msg?`<div class="box sm">${S.msg}</div>`:""}${st.map(row).join("")}${S.won.length>=3?btn(m.finish,"go('fin')"):""}`},
 delfi:()=>hud()+`<div class="who">${spr(PEOPLE.pizia)}<div><h2>Delfi</h2></div></div><div class="box"><div class="type" data-type="${esc(T.ui.pizia)}"></div></div>${typeControl()}<p class="sm">${T.ui.hints} ${S.hints}. ${T.ui.hintInfo}</p>${S.ob>0?btn(T.ui.buy,"buy()"):`<div class="box no">${T.ui.piziaNo}</div>`}${btn(T.ui.back,"go('map')","")}`,
 duel:()=>{const d=D();
  if(S.step<0)return hud()+`<div class="who">${spr(PEOPLE[d.sp])}<div><h2>${d.n}</h2></div></div><div class="box"><div class="type" data-type="${esc(d.card)}"></div></div>${typeControl()}${btn(T.ui.fight,"S.step=0;beep(520);R()")}`;
  const st=d.steps[S.step],tab=d.tablet?`<div class="wax"><b>TAVOLETTA</b>${d.tablet.map(x=>`<p>${x}</p>`).join("")}</div>`:"",left=st.ans.some((a,i)=>!a.ok&&!S.dead.includes(i));
  return hud()+`<p class="sm">${T.ui.step} ${S.step+1}/${d.steps.length}</p>${tab}<div class="who">${spr(PEOPLE.socrate,6)}<div class="sm"><b>Socrate:</b> <span class="type" data-type="${esc(st.q)}"></span></div></div>${typeControl()}<div class="player-card">${spr(av(S.av),4)}<div class="sm"><b>${T.avatars[S.av].n}:</b> scegli la risposta che mette alla prova l'argomento.</div></div>${S.fb?`<div class="box no">✘ −1 giorno. ${S.fb}</div>`:""}${st.ans.map((a,i)=>S.dead.includes(i)?"":btn(a.t,`ans(${i})`,"")).join("")}${S.hints>0&&left?btn(T.ui.hintBtn+" ("+S.hints+")","useHint()"):""}`},
 frag:()=>{const d=D();return hud()+`<h1 style="font-size:18px">${T.ui.fragT}</h1><div class="wax c"><b>FRAMMENTO ${S.won.length}/3</b><p>${d.frag}</p></div><p class="c ok">+${d.reward} oboli</p>${btn(T.ui.next,"go('map')")}`},
 fin:()=>{if(S.won.length<3)return hud()+`<div class="box no">Servono tutti e 3 i frammenti.</div>${btn(T.ui.back,"go('map')","")}`;return hud()+`<div class="who">${spr(PEOPLE.socrate)}<div><h2>Socrate</h2></div></div><div class="player-card">${spr(av(S.av),4)}<div class="sm"><b>${T.avatars[S.av].n}</b> · ${T.schools[S.sc].n}</div></div><div class="box">${T.ui.fin}</div>${btn(T.ui.tribunale,"go('finA')")}${S.ob>=30?btn(T.ui.esilio,"startDuel('soc')"):`<p class="sm">${T.ui.finNote}</p>`}`},
 finA:()=>endScr("A"),finB:()=>endScr("B"),
 lose:()=>hud()+`<div class="box no">${T.ui.lose}</div>${btn(T.ui.restart,"restart()")}`
};
/* ===== LOGICA ===== */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function typeControl(){return `<div class="typing-actions"><button onclick="skipTyping()">▶ TESTO COMPLETO</button></div>`}
function startTyping(){
 if(S.typingTimer)clearInterval(S.typingTimer);
 const els=[...document.querySelectorAll("[data-type]")];
 if(!els.length){S.typing=null;return}
 let n=0, total=els.reduce((a,e)=>a+e.dataset.type.length,0), done=0;
 S.typing={done:false};
 els.forEach(e=>e.textContent="");
 const step=()=>{
   if(!els.length)return;
   if(n>=els.length){S.typing.done=true;clearInterval(S.typingTimer);return}
   const e=els[n], full=e.dataset.type, pos=e.textContent.length;
   if(pos<full.length){e.textContent=full.slice(0,pos+1);done++;beep(760,.018)}
   else{n++}
 };
 S.typingTimer=setInterval(step,22);
}
function skipTyping(){
 if(!S.typing||S.typing.done)return;
 if(S.typingTimer)clearInterval(S.typingTimer);
 document.querySelectorAll("[data-type]").forEach(e=>e.textContent=e.dataset.type);
 S.typing.done=true;
}
function R(){document.getElementById("app").innerHTML=bar()+SC[S.scr]();startTyping()}
const bar=()=>`<div class="bar"><button onclick="tg()">SFX: ${S.snd?"SÌ":"NO"}</button></div>`;
function visit(id){if(id=="delfi")go("delfi");else if(S.won.includes(id)){S.msg="Hai già questo frammento.";beep(300);R()}else startDuel(id)}
Object.assign(PEOPLE,{pizia:{H:"#7a3b8a",S:"#e8b890",T:"#c9a0e0",E:"#222"},eraclito:{H:"#555",S:"#e8b890",T:"#a0522d",E:"#222"},protagora:{H:"#222",S:"#e8b890",T:"#d8c060",E:"#222"}});
const D=()=>T.duels[S.cur];
function go(s){S.scr=s;S.msg="";if(s=="intro")S.i=0;beep(520);R();scrollTo(0,0)}
function nextIntro(){S.i++;if(S.i>=T.intro.length)go("pick");else{beep(520);R()}}
function startDuel(id){S.cur=id;S.step=-1;S.dead=[];S.fb="";S.scr="duel";beep(520);R();scrollTo(0,0)}
function buy(){if(S.ob>0){S.ob--;S.hints++;beep(660)}R()}
function useHint(){const k=D().steps[S.step].ans.findIndex((a,i)=>!a.ok&&!S.dead.includes(i));if(k>=0&&S.hints>0){S.hints--;S.dead.push(k);beep(500)}R()}
function ans(i){const d=D();if(!d||S.step<0||!d.steps[S.step])return;const st=d.steps[S.step];if(st.ans[i]===undefined||S.days<=0)return;
 if(st.ans[i].ok){beep(300,.1);setTimeout(()=>beep(200,.25),120);S.step++;S.dead=[];S.fb="";
  if(S.step>=d.steps.length){if(S.cur=="soc")S.scr="finB";else{S.ob+=d.reward;S.won.push(S.cur);S.scr="frag"}beep(880,.3)}}
 else{S.days--;S.dead.push(i);S.fb=st.why;beep(150,.25);if(S.days<=0)S.scr="lose"}
 R();scrollTo(0,0)}
function endScr(k){const e=T.end[k],bx=t=>`<div class="box">${t}</div>`;return hud()+e.a.map(bx).join("")+`<div class="box blk c">${T.ui.fade}</div><div class="fade">${e.b.map(bx).join("")}</div>`+btn(T.ui.restart,"restart()")}
function restart(){S.days=5;S.ob=0;S.won=[];S.hints=0;go("title")}
R();
</script></body></html>
