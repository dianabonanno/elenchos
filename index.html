function shade(hex,amt){
 const n=parseInt(hex.slice(1),16);
 let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
 r=Math.max(0,Math.min(255,r+amt));g=Math.max(0,Math.min(255,g+amt));b=Math.max(0,Math.min(255,b+amt));
 return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function spr(p,px,full){
 if(px===undefined)px=9;
 const c={...p};
 if(c.T&&!c.D)c.D=shade(c.T,-40);
 if(c.H&&!c.HD)c.HD=shade(c.H,-30);
 let r="";
 BASE.forEach((row,y)=>[...row].forEach((ch,x)=>{
   if(ch!=="."&&c[ch]) r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${c[ch]}"/>`;
 }));
 if(full) return `<svg viewBox="0 0 8 10" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${r}</svg>`;
 return `<svg width="${8*px}" height="${10*px}" viewBox="0 0 8 10" aria-hidden="true">${r}</svg>`;
}

/* ================= AUDIO ================= */
function playFile(src,vol){
 if(!src||!S.snd)return false;
 try{const a=new Audio(src);a.volume=(vol==null?.5:vol);a.play().catch(()=>{});return true;}catch(e){return false;}
}
function sfx(name,vol){
 if(!S.snd)return;
 if(playFile(AUDIO.sfx[name],vol))return;
 const map={
  chains:[140,.18,"square"],crowd:[220,.4,"sawtooth"],wind:[90,.6,"sine"],
  waves:[110,.5,"sine"],gulls:[900,.15,"sine"],drum:[70,.25,"triangle"],
  tablet:[900,.28,"square"],blip:[760,.02,"square"],coin:[1200,.1,"square"],door:[300,.12,"square"]
 };
 const m=map[name]||[600,.08,"square"];
 try{
  AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=m[2];o.frequency.value=m[0];g.gain.value=.05;
  o.connect(g);g.connect(AC.destination);o.start();
  if(name==="tablet"){try{o.frequency.exponentialRampToValueAtTime(120,AC.currentTime+.28);}catch(_){}}
  o.stop(AC.currentTime+m[1]);
 }catch(e){}
}
function beep(f,d){
 if(d===undefined)d=.12;
 if(!S.snd)return;
 if(playFile(AUDIO.sfx.blip,.22))return;
 try{
  AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();
  o.type="square";o.frequency.value=f;g.gain.value=.04;
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);
 }catch(e){}
}
function setBgm(which){
 const el=document.getElementById("bgm");if(!el)return;
 const src=which==="tense"?AUDIO.bgmTense:(which==="none"?"":AUDIO.bgm);
 if(!src){try{el.pause();}catch(e){}return;}
 if(el.dataset.src!==src){el.dataset.src=src;el.src=src;el.loop=true;}
 if(S.snd)el.play().catch(()=>{});
}
function tg(){
 S.snd=!S.snd;
 const el=document.getElementById("bgm");
 if(!S.snd){try{el.pause();}catch(e){}}
 else{setBgm(S.scr==="duel"?"tense":"main");}
 beep(440);R();
}

/* ================= CELLE ================= */
function cellHtml(ch,x,y,z){
 const ground=z.ground||"#c9b98a";
 let bg=ground,inner="";
 if(ch==="#"){
  bg="#4a4a5a";
  inner=`<svg class="bg" viewBox="0 0 8 8" preserveAspectRatio="none"><rect width="8" height="8" fill="#4a4a5a"/><rect x="0" y="0" width="8" height="1" fill="#5a5a6a"/><rect x="0" y="4" width="8" height="1" fill="#3a3a4a"/><rect x="3" y="0" width="1" height="4" fill="#3a3a4a"/><rect x="6" y="4" width="1" height="4" fill="#3a3a4a"/></svg>`;
 } else if(ch==="T"){
  bg="#8a9a5a";
  inner=`<svg class="bg" viewBox="0 0 8 8" preserveAspectRatio="none"><rect width="8" height="8" fill="#a8b878"/><rect x="3" y="5" width="2" height="3" fill="#6b4a1e"/><circle cx="4" cy="3" r="3" fill="#3a6a2a"/><circle cx="3" cy="2" r="2" fill="#5a8a4a"/></svg>`;
 } else if(ch==="~"){
  bg="#3a6fa8";
  inner=`<svg class="bg" viewBox="0 0 8 8" preserveAspectRatio="none"><rect width="8" height="8" fill="#3a6fa8"/><rect x="0" y="2" width="8" height="1" fill="#6fa8d8" opacity=".6"/><rect x="0" y="5" width="8" height="1" fill="#6fa8d8" opacity=".4"/></svg>`;
 } else if(ch==="D"){
  inner=`<svg class="bg" viewBox="0 0 8 8" preserveAspectRatio="none"><rect width="8" height="8" fill="${ground}"/><rect x="1" y="1" width="6" height="7" fill="#6b4a1e" stroke="#3a2010" stroke-width=".4"/><rect x="2" y="2" width="4" height="2" fill="#8a6a3a" opacity=".6"/><circle cx="6" cy="5" r=".6" fill="#f2c14e"/></svg>`;
 } else if(ch==="X"){
  bg="#8a7a5a";
  inner=`<svg class="bg" viewBox="0 0 8 8" preserveAspectRatio="none"><rect width="8" height="8" fill="${ground}"/><polygon points="4,1 6.5,5 4,4 1.5,5" fill="#f2c14e" stroke="#1b1b2f" stroke-width=".4"/><rect x="3.4" y="5" width="1.2" height="2.5" fill="#1b1b2f"/></svg>`;
 } else {
  bg=(x+y)%2===0?ground:shade(ground,-8);
  inner=`<svg class="bg" viewBox="0 0 8 8" preserveAspectRatio="none"><rect width="8" height="8" fill="${bg}"/></svg>`;
 }
 let npc="";
 if(ch==="S")npc=spr(PEOPLE.socrate,0,true);
 else if(ch==="P")npc=spr(PEOPLE.platone,0,true);
 else if(ch==="G")npc=spr(PEOPLE.guard,0,true);
 else if(ch==="Z")npc=spr(PEOPLE.pizia,0,true);
 else if(ch==="F"&&z.boss)npc=spr(PEOPLE[T.duels[z.boss].sp],0,true);
 return `<div class="cell" style="background:${bg}">${inner}${npc?`<div class="npc">${npc}</div>`:""}</div>`;
}

 let s="";
 const pts=[[30,60],[45,55],[60,62],[38,68],[52,70]];
 pts.forEach((p,i)=>{
  s+=`<div style="position:absolute;left:${p[0]}%;top:${p[1]}%;width:10px;height:10px;border-radius:50%;background:#e8d8f0;opacity:.5;filter:blur(2px);animation:smoke 3.2s ease-out infinite;animation-delay:${i*.5}s"></div>`;
 });
 return s;
}
function curZone(){return HUBS[S.ex.hub][S.ex.zone];}

/* ================= MOVIMENTO ================= */
function mv(dx,dy){
 if(S.scr!=="explore")return;
 const z=curZone();
 const nx=S.ex.x+dx, ny=S.ex.y+dy;
 const row=z.tiles[ny];if(!row)return;
 const ch=row[nx];if(!ch)return;
 if(ch==="#"||ch==="T"||ch==="~"){sfx("door",.15);beep(160,.04);return;}
 if("SPGZF".includes(ch)){interact(ch);return;}
 S.ex.x=nx;S.ex.y=ny;
 beep(620,.02);
 const p=z.portals&&z.portals[nx+","+ny];
 if(p){
  sfx("door",.25);
  if(p.map){go("map");return;}
  S.ex.zone=p.zone;S.ex.x=p.x;S.ex.y=p.y;
  R();scrollTo(0,0);return;
 }
 const el=document.getElementById("pl");
 if(el){
  const cols=z.tiles[0].length,rows=z.tiles.length;
  el.style.left=(S.ex.x*100/cols)+"%";
  el.style.top=(S.ex.y*100/rows)+"%";
 }
}
function interact(ch){
 if(ch==="S"){
  if(!S.flags.metSocrate) talk("socrate_cell",()=>{S.flags.metSocrate=1;});
  else talk("socrate_cell",null);
  return;
 }
 if(ch==="P"){
  if(!S.flags.gotRing){talk("plato_inn",()=>{S.flags.gotRing=1;floatText(T.ui.ring);sfx("coin",.5);});}
  else talk("plato_inn",null);
  return;
 }
 if(ch==="G"){talk("guard",null);return;}
 if(ch==="Z"){go("delfi");return;}
 if(ch==="F"){
  const b=curZone().boss;
  if(b)startDuel(b);
 }
}
function startExplore(){S.ex={hub:"atene",zone:"piazza",x:5,y:4};S.msg="";go("explore");}
function enterHub(hub,zone,x,y){S.ex={hub,zone,x,y};S.msg="";go("explore");}

document.addEventListener("keydown",e=>{
 if(S.scr!=="explore")return;
 const k=e.key.toLowerCase();
 if(k==="arrowup"||k==="w"){e.preventDefault();mv(0,-1);}
 else if(k==="arrowdown"||k==="s"){e.preventDefault();mv(0,1);}
 else if(k==="arrowleft"||k==="a"){e.preventDefault();mv(-1,0);}
 else if(k==="arrowright"||k==="d"){e.preventDefault();mv(1,0);}
});

/* ================= LOGICA ================= */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function typeControl(){return `<div class="typing-actions"><button onclick="skipTyping()">${T.ui.skip}</button></div>`}
function startTyping(){
 if(S.typingTimer)clearInterval(S.typingTimer);
 const els=[...document.querySelectorAll("[data-type]")];
 if(!els.length){S.typing=null;return;}
 let n=0;
 S.typing={done:false};
 els.forEach(e=>e.textContent="");
 S.typingTimer=setInterval(()=>{
  if(n>=els.length){S.typing.done=true;clearInterval(S.typingTimer);return;}
  const e=els[n],full=e.dataset.type,pos=e.textContent.length;
  if(pos<full.length){e.textContent=full.slice(0,pos+1);beep(760,.018);}
  else n++;
 },22);
}
function skipTyping(){
 if(!S.typing||S.typing.done)return;
 if(S.typingTimer)clearInterval(S.typingTimer);
 document.querySelectorAll("[data-type]").forEach(e=>e.textContent=e.dataset.type);
 S.typing.done=true;
}
function R(){
 document.getElementById("app").innerHTML=bar()+SC[S.scr]();
 startTyping();
 setBgm(S.scr==="duel"?"tense":(S.scr==="lose"||S.scr==="finA"||S.scr==="finB")?"none":"main");
}
function go(s){S.scr=s;S.msg="";beep(520);R();scrollTo(0,0);}
function cutAdvance(){
 S.cutIdx++;
 if(S.cutIdx>=T.cutIntro.length){S.cutIdx=0;go("intro");return;}
 beep(520);R();
}
function nextIntro(){
 S.i++;
 if(S.i>=T.intro.length)go("pick");
 else{beep(520);R();}
}
function talk(key,next){S.talk={key,i:0};S.talkNext=next||null;S.scr="dlg";beep(520);R();scrollTo(0,0);}
function nextTalk(){
 S.talk.i++;
 if(S.talk.i>=TALK[S.talk.key].length){
  const n=S.talkNext;S.talkNext=null;S.talk=null;
  if(n)n();
  S.scr="explore";R();scrollTo(0,0);
 } else {beep(520);R();}
}
const D=()=>T.duels[S.cur];
function startDuel(id){
 S.cur=id;S.step=-1;S.dead=[];S.fb="";S.scr="duel";
 sfx("drum",.4);beep(520);R();scrollTo(0,0);
}
function startFight(){S.step=0;beep(520);R();scrollTo(0,0);}
function buy(){if(S.ob>0){S.ob--;S.hints++;sfx("coin",.4);beep(660);}R();}
function useHint(){
 const st=D().steps[S.step];
 const k=st.ans.findIndex((a,i)=>!a.ok&&!S.dead.includes(i));
 if(k>=0&&S.hints>0){S.hints--;S.dead.push(k);beep(500);}
 R();
}
function floatText(txt){
 const d=document.createElement("div");
 d.className="float-up";d.textContent=txt;
 document.body.appendChild(d);
 setTimeout(()=>d.remove(),2200);
}
function ans(i){
 const d=D();
 if(!d||S.step<0||!d.steps[S.step])return;
 const st=d.steps[S.step];
 if(st.ans[i]===undefined||S.days<=0)return;
 if(st.ans[i].ok){
  beep(300,.1);setTimeout(()=>beep(200,.25),120);
  S.step++;S.dead=[];S.fb="";
  if(S.step>=d.steps.length){
   if(S.cur==="soc")S.scr="finB";
   else{S.ob+=d.reward;S.won.push(S.cur);S.scr="frag";floatText("+"+d.reward+" OBOLI");sfx("coin",.6);}
   beep(880,.3);
  }
 } else {
  S.days--;S.dead.push(i);S.fb=st.why;
  sfx("tablet",.5);beep(150,.25);
  const app=document.getElementById("app");
  app.classList.add("shake");
  setTimeout(()=>app.classList.remove("shake"),420);
  if(S.days<=0)S.scr="lose";
 }
 R();scrollTo(0,0);
}
function endScr(k){
 const e=T.end[k];
 const bx=t=>`<div class="box">${esc(t)}</div>`;
 const cut=k==="A"?cutAthens():cutShip(false);
 return `<div class="cut">${cut}</div>`
  +hud()
  +e.a.map(bx).join("")
  +`<div class="box blk c">${T.ui.fade}</div>`
  +`<div class="fade">${e.b.map(bx).join("")}</div>`
  +btn(T.ui.restart,"restart()");
}
function restart(){
 S.days=5;S.ob=0;S.won=[];S.hints=0;S.flags={};
 S.i=0;S.cutIdx=0;S.talk=null;S.talkNext=null;
 S.step=-1;S.dead=[];S.fb="";S.cur="";S.msg="";
 go("title");
}
function visit(id){
 if(S.won.includes(id)){S.msg="Hai già questo frammento.";beep(300);R();return;}
 if(id==="delfi")enterHub("delfi","santuario",4,4);
 else if(id==="pit")enterHub("crotone","citta",4,4);
 else if(id==="era")enterHub("efeso","citta",4,4);
 else if(id==="pro")enterHub("agora","citta",4,4);
}

/* avvia */
R();
</script></body></html>
